kind = "web"
previewPath = "/"
title = "Nitya ENT Hospital"
description = "A modern hospital website for Nitya ENT with appointment requests, doctor availability, hospital events and achievements, Google review links, and a secure admin content manager."
version = "1.0.0"
id = "artifacts/nitya-ent"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22013

[services.development]
run = "pnpm --filter @workspace/nitya-ent run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nitya-ent", "run", "build" ]
serve = "static"
publicDir = "artifacts/nitya-ent/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22013"
BASE_PATH = "/"
